  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-name">Sozan Michael McCord</a>
      <ul class="nav-links">
        <li><a href="about.html">About</a></li>
        <li><a href="talks.html">Talks</a></li>
        <li><a href="teachings.html" class="active">Teachings</a></li>
        <li><a href="coaching.html">Coaching</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <button class="hamburger" aria-label="Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </nav>

  <div class="mobile-overlay"></div>
  <div class="mobile-panel">
    <a href="about.html">About</a>
    <a href="talks.html">Talks</a>
    <a href="teachings.html" class="active">Teachings</a>
    <a href="coaching.html">Coaching</a>
    <a href="contact.html">Contact</a>
  </div>

  <!-- Page Header -->
  <header class="page-header">
    <h1>Teachings</h1>
    <p class="subtitle">Reflections on practice</p>
  </header>

  <!-- Quote -->
  <section class="content-section">
    <div class="teaching-quote reveal">
      <div class="line"></div>
      <blockquote>In the beginner's mind there are many possibilities, but in the expert's mind there are few.</blockquote>
      <p class="attribution">Shunryu Suzuki</p>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2026 Sozan Michael McCord</p>
  </footer>

  <script>
    window.addEventListener('scroll', () => {
      document.querySelector('.nav').classList.toggle('scrolled', window.scrollY > 50);
    });

    const hamburger = document.querySelector('.hamburger');
    const mobilePanel = document.querySelector('.mobile-panel');
    const mobileOverlay = document.querySelector('.mobile-overlay');

    function toggleMobile() {
      hamburger.classList.toggle('open');
      mobilePanel.classList.toggle('open');
      mobileOverlay.classList.toggle('open');
    }

    hamburger.addEventListener('click', toggleMobile);
    mobileOverlay.addEventListener('click', toggleMobile);

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.classList.add('visible');
      });
    }, { threshold: 0.15 });

    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
  </script>

</body>
</html>
